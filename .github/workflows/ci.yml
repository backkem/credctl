name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deny everything by default; each job asks for exactly what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # cmake: aws-lc-sys (via the AWS SDK). fontconfig: yeslogic-fontconfig-sys (via xilem).
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libfontconfig1-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features
